<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Events</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
  <nav class="navbar navbar-light bg-light">
    <div class="container">
      <span class="navbar-brand fw-semibold">Local Events</span>
    </div>
  </nav>

  <header class="py-4 border-bottom bg-white">
    <div class="container">
      <h1 class="h3 mb-0">Find local events near you</h1>
    </div>
  </header>

  <section class="py-3">
    <div class="container">
      <div class="row g-2">
        <div class="col-md-4">
          <label class="form-label" for="keywords">Keywords</label>
          <input id="keywords" class="form-control" placeholder="ex: jazz, workshop">
        </div>
        <div class="col-md-3">
          <label class="form-label" for="date">Date</label>
          <input id="date" type="date" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label" for="category">Category</label>
          <select id="category" class="form-select">
            <option selected>All</option>
            <option>Concert</option>
            <option>Workshop</option>
            <option>Sport</option>
            <option>Festival</option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <label class="form-label invisible">&nbsp;</label>
          <button id="btnFilter" class="btn btn-primary" type="button">Show results</button>
        </div>
      </div>
    </div>
  </section>

  <main class="py-3" id="events">
    <div class="container">
      <h2 class="h4 mb-3">Events near you</h2>

      <div id="eventsGrid" class="row row-cols-1 row-cols-md-3 g-3"></div>

      <nav class="mt-4" aria-label="Events pagination">
        <ul class="pagination justify-content-center">
          <li class="page-item"><button id="btnPrev" class="page-link" type="button">Previous</button></li>
          <li class="page-item"><span id="pageInfo" class="page-link">1 / 1</span></li>
          <li class="page-item"><button id="btnNext" class="page-link" type="button">Next</button></li>
        </ul>
      </nav>
    </div>
  </main>

  <section class="py-4 border-top bg-white">
    <div class="container">
      <h2 class="h4 mb-2">Events Map</h2>
      <p class="small text-muted mb-3">Click a marker to open the event details.</p>
      <div id="map" class="border rounded"></div>
    </div>
  </section>


  <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">

        <div class="modal-header">
          <h5 id="modalTitle" class="modal-title">Event</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <p id="modalInfo" class="text-muted mb-3"></p>
          <button id="btnShowOnMap" type="button" class="btn btn-outline-primary btn-sm mb-3">
            Show on map
          </button>

          <hr>

          <h6 class="mb-2">Video preview (Video API)</h6>
          <video id="videoLive" class="w-100 border rounded mb-2" autoplay playsinline muted></video>

          <div class="small text-muted mb-2">Recorded video</div>
          <video id="videoRecorded" class="w-100 border rounded mb-2" controls></video>

          <div class="d-flex flex-wrap gap-2 mb-3">
            <button id="btnCamOn" class="btn btn-sm btn-primary" type="button">Camera ON</button>
            <button id="btnCamOff" class="btn btn-sm btn-outline-secondary" type="button" disabled>OFF</button>
            <button id="btnVidStart" class="btn btn-sm btn-success" type="button" disabled>Start recording</button>
            <button id="btnVidStop" class="btn btn-sm btn-danger" type="button" disabled>Stop</button>
          </div>

          <h6 class="mb-2">Audio note (Audio API)</h6>
          <audio id="audioPlayer" controls class="w-100 mb-2"></audio>

          <div class="d-flex flex-wrap gap-2">
            <button id="btnAudioStart" class="btn btn-sm btn-success" type="button">Record</button>
            <button id="btnAudioStop" class="btn btn-sm btn-danger" type="button" disabled>Stop</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer class="py-3 border-top text-center text-muted bg-white">

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="scripts/map.js"></script>
  <script src="scripts/audio.js"></script>
  <script src="scripts/video.js"></script>
  <script src="scripts/app.js"></script>
</body>

</html>
